# 站点配置（Ubuntu/Debian 路径示例）
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vue-admin
#   sudo ln -s /etc/nginx/sites-available/vue-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书：先按 DEPLOY.md 用 certbot 申请，certbot 会自动改写本文件补全 ssl_certificate 路径；
#        此处已按 certbot 默认路径占位，域名替换为你真实的即可。

# HTTP → HTTPS 跳转 + 证书校验目录
server {
    listen 80;
    server_name your.domain.com;

    # certbot 申请证书时需要的校验目录（保留）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name your.domain.com;

    # ↓↓↓ certbot 申请的证书（把 your.domain.com 换成你的真实域名）↓↓↓
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态产物（vite build 输出）
    root /var/www/vue-admin/dist;
    index index.html;

    # SPA 路由回退：刷新子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含小程序开放接口 /api/open/*）
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 关键：透传协议，后端据此推导 https 上传地址（server.js 已支持）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # 上传的图片（由 node 提供，走同一后端）
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传图片上限（后端另有限制 5MB，这里留余量）
    client_max_body_size 10m;
}
